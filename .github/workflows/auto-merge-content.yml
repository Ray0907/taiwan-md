name: Auto-merge content PRs

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'knowledge/**/*.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only auto-merge PRs from Decap CMS (open authoring)
    if: contains(github.head_ref, 'cms/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check only markdown files changed
        id: check
        run: |
          # Get list of changed files
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "Changed files:"
          echo "$FILES"

          # Check all files are markdown in knowledge/
          NON_MD=$(echo "$FILES" | grep -v '^knowledge/.*\.md$' || true)
          if [ -n "$NON_MD" ]; then
            echo "Non-markdown files found, skipping auto-merge:"
            echo "$NON_MD"
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "All changes are markdown content files"
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve and merge
        if: steps.check.outputs.safe == 'true'
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
